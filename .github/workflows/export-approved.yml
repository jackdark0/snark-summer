name: Export Approved Database

on:
  issues:
    types: [closed]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    # Only run when an issue is closed with the approved label
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'status: approved')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch all approved issues and rebuild CSV
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'status: approved',
              state: 'closed',
              per_page: 100
            });

            const rows = [
              ['tp_id', 'title', 'verbatim', 'platform', 'narrative_cluster',
               'tactic_tag', 'first_seen', 'source_url', 'date_approved', 'issue_url']
            ];

            for (const issue of issues) {
              const body = issue.body || '';

              // Parse fields from issue body
              const extract = (label) => {
                const match = body.match(new RegExp(`### ${label}[\\s\\S]*?\\n([^\\n#]+)`));
                return match ? match[1].trim().replace(/,/g, ';') : '';
              };

              const labels = issue.labels.map(l => l.name);
              const platform = labels.find(l => l.startsWith('platform:'))?.replace('platform: ', '') || '';
              const cluster  = labels.find(l => l.startsWith('cluster:'))?.replace('cluster: ', '') || '';
              const tactic   = labels.find(l => l.startsWith('tactic:'))?.replace('tactic: ', '') || '';

              const tpId = `TP-${String(issue.number).padStart(4, '0')}`;

              rows.push([
                tpId,
                issue.title.replace('[SUBMISSION] ', '').replace(/,/g, ';'),
                extract('Verbatim claim'),
                platform,
                cluster,
                tactic,
                extract('Date first seen'),
                extract('Source URL or screenshot reference'),
                issue.closed_at?.split('T')[0] || '',
                issue.html_url
              ]);
            }

            const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
            fs.writeFileSync('data/approved.csv', csv);
            console.log(`Wrote ${rows.length - 1} approved entries to data/approved.csv`);

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approved.csv
          git diff --staged --quiet || git commit -m "chore: update approved talking points database [auto]"
          git push
